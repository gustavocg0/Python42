[project]
name = "soc-entitlements"
version = "0.1.0"
description = "Cached, fail-closed entitlements client (ADR-0005, SEC-39) + HMAC service tokens for internal APIs (design §5.1, SEC-40)."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.28",
    "soc-schemas",
]

[tool.uv.sources]
soc-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soc_entitlements"]
