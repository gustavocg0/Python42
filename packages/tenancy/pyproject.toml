[project]
name = "soc-tenancy"
version = "0.1.0"
description = "Tenant-context middleware, pluggable tenant resolvers, RLS GUC helper (SEC-23), tenant-scoped ES naming (SEC-24), and gateway-auth middleware (SEC-14)."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.115",
    "soc-schemas",
]

[tool.uv.sources]
soc-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soc_tenancy"]
