[project]
name = "soc-pipeline"
version = "0.1.0"
description = "Transport abstraction over Redis Streams (ADR-0004). The ONLY way services/workers touch the pipeline; enforces tenant_id + trace_id on every message (SEC-20)."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.7",
    "redis>=5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soc_pipeline"]
