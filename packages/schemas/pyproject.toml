[project]
name = "soc-schemas"
version = "0.1.0"
description = "Canonical pydantic models for the internal event schema (docs/contracts/event-schema.md) and the API error envelope (docs/contracts/api-contracts.md §1-2). The contract documents win on conflict."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soc_schemas"]
