[project]
name = "soc-audit"
version = "0.1.0"
description = "Append-only audit writer (SEC-42..45): same-transaction INSERTs into audit_log, DB-clock timestamps, secret redaction, no raw payloads by design."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soc_audit"]
