[project]
name = "soc-telemetry"
version = "0.1.0"
description = "OpenTelemetry setup, structured JSON logging, and per-stage pipeline metrics labeled {tenant_id, stage, outcome} (AC-91)."
requires-python = ">=3.13"
dependencies = [
    "opentelemetry-sdk>=1.30",
]

[project.optional-dependencies]
otlp = [
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soc_telemetry"]
