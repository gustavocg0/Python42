id: proc-credential-dumping-tool
version: "1.0.0"
title: Credential Dumping Tool Execution
description: >
  Detects execution of known credential-theft tools by image name (Mimikatz,
  LaZagne, pwdump, gsecdump, WCE, secretsdump, nanodump, Dumpert) or by
  unmistakable Mimikatz-style command-line modules (sekurlsa, lsadump,
  logonpasswords, kerberos::golden, privilege::debug, dpapi::). Any hit is
  credential theft in progress or an authorized penetration test — there is no
  routine business use, hence critical severity.
severity: critical
event_class: process_activity
min_schema_version: "1.0.0"
mitre_technique_ids:
  - T1003
  - T1003.001
  - T1003.006
entity:
  - host.hostname
  - user.name
detection:
  condition:
    any:
      - field: process.name
        op: iin
        value: ["mimikatz.exe", "lazagne.exe", "pwdump.exe", "gsecdump.exe", "wce.exe", "secretsdump.exe", "nanodump.exe", "dumpert.exe"]
      - field: process.cmd_line
        op: icontains
        value: ["sekurlsa", "lsadump", "logonpasswords", "kerberos::golden", "privilege::debug", "dpapi::"]
false_positives:
  - Authorized penetration tests and red-team exercises. Confirm the engagement
    window with management before closing; close as expected_behavior only with a
    named engagement.
  - Renaming a benign binary to a listed name would match — acceptable, since that
    is itself suspicious.
references:
  - https://attack.mitre.org/techniques/T1003/
  - https://attack.mitre.org/techniques/T1003/001/
  - https://attack.mitre.org/techniques/T1003/006/
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_hktl_mimikatz_command_line.yml
