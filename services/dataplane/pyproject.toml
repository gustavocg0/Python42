[project]
name = "dataplane"
version = "0.1.0"
description = "Data-plane API + workers: ingest, enrollment, assets, alerts, rules, investigation stub, audit query, normalizer/detector/alerter/triager workers, scheduled jobs"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.10",
    "asyncpg>=0.30",
    "redis>=5.2",
    "httpx>=0.28",
    "elasticsearch>=8.17",
    "pyyaml>=6.0",
    "cryptography>=44.0",
    "langgraph>=0.3",
    "anthropic>=0.49",
    "soc-schemas",
    "soc-pipeline",
    "soc-tenancy",
    "soc-entitlements",
    "soc-audit",
    "soc-telemetry",
]

[tool.uv.sources]
soc-schemas = { workspace = true }
soc-pipeline = { workspace = true }
soc-tenancy = { workspace = true }
soc-entitlements = { workspace = true }
soc-audit = { workspace = true }
soc-telemetry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataplane"]
