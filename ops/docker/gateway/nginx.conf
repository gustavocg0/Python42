# Main nginx config for the ingest-gateway (nginx-unprivileged base).
# Mirrors the unprivileged image defaults (pid + temp paths under /tmp so the
# container can run with a read-only root fs) and loads the njs module used
# for client-cert -> identity-header mapping (ADR-0006).

load_module modules/ngx_http_js_module.so;

worker_processes  auto;
error_log  /var/log/nginx/error.log notice;   # symlinked to stderr in image
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    proxy_temp_path       /tmp/proxy_temp_path;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" ssl_verify=$ssl_client_verify';
    access_log /var/log/nginx/access.log main;  # symlinked to stdout in image

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;

    # Rendered from /etc/nginx/templates/*.template by the image entrypoint
    # (envsubst injects GATEWAY_AUTH_SECRET).
    include /etc/nginx/conf.d/*.conf;
}
