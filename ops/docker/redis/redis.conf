# Redis config for the POC stack — hardened per SEC-19 to the degree a local
# compose deployment supports:
#   - AOF everysec (bounded loss window, design §4 / SEC-22)
#   - password auth (requirepass is appended on the command line from .env)
#   - destructive/admin commands disabled for everyone (the app never uses
#     them; per-user ACLs are the production stamp's job)
#   - internal compose network only (never published to the host outside the
#     debug profile)

# Persistence: AOF only (streams + counters survive restarts; RDB snapshots off).
appendonly yes
appendfsync everysec
save ""
dir /data

# SEC-19: no FLUSH*/CONFIG/etc. from any client.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command DEBUG ""
rename-command SHUTDOWN ""
rename-command REPLICAOF ""
rename-command SLAVEOF ""

# Memory: streams are MAXLEN-capped by soc_pipeline (ADR-0004); leave
# maxmemory unset for dev (host-bounded).
protected-mode yes
